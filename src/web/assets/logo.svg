<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- 徽标背景底座渐变 -->
    <linearGradient id="tb-emblem-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="1"/>
    </linearGradient>

    <!-- 赛博护盾边框渐变 -->
    <linearGradient id="tb-emblem-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- 炽阳主烈焰 (Cyber Flame) -->
    <linearGradient id="tb-flame-outer" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="25%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#ff7a1a"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- AI 等离子冷焰 (Plasma Inner Core) -->
    <linearGradient id="tb-flame-inner" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="tb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 护盾底座 -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#tb-emblem-bg)" stroke="url(#tb-emblem-stroke)" stroke-width="3.5"/>

  <!-- 炽阳主烈焰 (Cyber Flame) -->
  <path d="M 64 104 C 46.8 104 28 86.2 28 63 C 28 44.5 39.5 32.8 47.7 22.2 C 49.1 20.4 51.9 21.1 51.9 23.3 C 51.9 34 60 41.8 67.2 41.8 C 74.4 41.8 76.5 34 75.4 25.8 C 74.7 19.8 80.7 16.3 85 20.4 C 95.8 30.7 100 46.8 100 64.7 C 100 86.2 82.8 104 64 104 Z" fill="url(#tb-flame-outer)" filter="url(#tb-glow)"/>

  <!-- AI 等离子冷焰 (Plasma Core) -->
  <path d="M 64 95 C 52.6 95 42 83.6 42 69.4 C 42 57.7 49 48.8 54.4 41.7 C 55.8 39.9 57.9 41 57.9 42.8 C 57.9 49.5 63.3 55.9 68.6 55.9 C 74 55.9 75.7 50.6 75.7 46 C 75.7 43.1 79.3 41 82.1 44.5 C 86.4 50.6 88.2 59.5 88.2 70.1 C 88.2 84.4 77.5 95 64 95 Z" fill="url(#tb-flame-inner)"/>

  <!-- 悬浮 Token 晶核 (Quantum Spark) -->
  <polygon points="64,61 74,73.5 64,86 54,73.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="64" cy="73.5" r="3.5" fill="#00f2fe"/>

  <!-- 环绕高能微粒 (Embers) -->
  <circle cx="91" cy="27" r="3.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="35" cy="30" r="2.8" fill="#00f2fe" opacity="0.85"/>
  <circle cx="28" cy="80" r="2.2" fill="#ff7a1a" opacity="0.75"/>
</svg>
